/* ---- ch01.js ---- */
/* 第一章：Meta 分析是什么 */

ML.chapters.push({
  id: "ch01",
  num: "第一章",
  title: "Meta 分析是什么",
  minutes: 20,
  goals: [
    "能一句话说出 Meta 分析的定义",
    "能说出它与传统叙述性综述的本质区别",
    "能用 PICO 把一个体育科学问题拆成四个部分",
    "能说出哪两种情况下不该做 Meta 分析"
  ],
  sections: [
    {
      h: "一句话定义：把多个研究合成一个结论",
      body: `
        <p>Meta 分析（meta-analysis）的定义可以压缩成一句话：<b>用统计方法，把多个独立研究的结果定量地合并起来，得到一个更可靠的综合结论。</b></p>
        <p>关键词是"定量合并"。传统综述（narrative review，叙述性综述）是作者把文献通读一遍，用文字描述"有的研究说有效、有的说没效"；而 Meta 分析是把每个研究的结果变成数字，按明确的规则加权平均，最后算出一个"总体效应"和它的可信区间。</p>
        <table class="tbl">
          <tr><th></th><th>叙述性综述</th><th>Meta 分析</th></tr>
          <tr><td>合成方式</td><td>文字描述</td><td>统计合并</td></tr>
          <tr><td>结论长什么样</td><td>"结果不太一致，大致有效"</td><td>"总体效应 0.65，95% 可信区间 [0.42, 0.88]"</td></tr>
          <tr><td>主观性</td><td>较高，取决于作者怎么讲</td><td>较低，每一步都有事先定好的规则</td></tr>
        </table>
        <p>举个体育的例子：关于"冷水浸泡能不能缓解运动后肌肉酸痛"，你搜到 15 个试验，有的说有效、有的说没用。叙述性综述会写"结果不一致"；Meta 分析会把 15 个研究的数据合并，告诉你总体上能降低酸痛约 0.6 个标准差——以及这个结论的把握有多大。</p>
        <p>再澄清一对常混淆的概念：系统评价（systematic review）和 Meta 分析。系统评价是"系统地找、系统地筛、系统地评价"的全套方法，Meta 分析只是其中最后一步的统计合并。一项研究可以只做系统评价而不做 Meta 分析（本章后面会说哪两种情况），但任何 Meta 分析都应该建立在系统评价的基础上。</p>
        <div class="tip">💡 记住这个感觉：Meta 分析 = 用数学给文献"投票"，但不是一人一票，而是按每个研究的样本量和精确度"加权投票"。</div>
      `
    },
    {
      h: "为什么需要它：单个研究不够用",
      body: `
        <p>先看单个研究的两大致命伤。</p>
        <p>第一，<b>样本太小</b>。很多运动科学试验只有十几二十人参加——比如每组 10 人的力量训练试验。这么小的样本，偶然性很大：这批人测出来"有效"，换一批人可能就"没效"了。小样本研究还特别容易只发表阳性结果，这个坑叫发表偏倚（publication bias），第八章专讲。</p>
        <p>第二，<b>结论互相打架</b>。A 研究说咖啡因提高耐力表现，B 研究说没区别，C 研究说只对新手有效。你该信谁？"数人头"（3 个说有效、2 个说没效）是最粗糙的办法——它完全忽略了每个研究的样本量和精确度。Meta 分析的做法是：样本量大、估计精确的研究，在合并时占更大的权重。</p>
        <p>所以 Meta 分析回答的是这样一类问题："把全世界关于这个问题的合格研究放在一起看，总体答案是什么？这个答案的可信度有多高？"</p>
        <p>体会一下"数人头"有多不靠谱：假设 3 个关于咖啡因的研究，A（每组 12 人）说有效，B（每组 15 人）说没效，C（每组 200 人）说有效。数人头是 2 比 1，"好像有效"；但 C 一项研究的人数就超过 A、B 之和，它的估计精确得多。Meta 分析会让 C 占大头——这才是尊重证据的做法。</p>
        <div class="warn">⚠️ 易错点：Meta 分析不能"无中生有"。如果纳入的原始研究质量都很差，合并出来的也只是"精确的错误"——这叫"垃圾进、垃圾出"（garbage in, garbage out）。</div>
      `
    },
    {
      h: "PICO：把研究问题拆成四个零件",
      body: `
        <p>做 Meta 分析的第一步，是把你的问题拆成四个明确的部分，这就是 PICO：</p>
        <table class="tbl">
          <tr><th>字母</th><th>含义</th><th>问的是</th></tr>
          <tr><td>P</td><td>参与者（participants / population）</td><td>研究对象是谁？</td></tr>
          <tr><td>I</td><td>干预（intervention）</td><td>用了什么手段？</td></tr>
          <tr><td>C</td><td>对照（comparison）</td><td>跟什么比？</td></tr>
          <tr><td>O</td><td>结局（outcome）</td><td>看什么指标？</td></tr>
        </table>
        <p>拿"冷水浸泡对运动后肌肉酸痛恢复的影响"来拆：P = 运动后出现肌肉酸痛的运动员或锻炼者；I = 冷水浸泡（还要说清水温、泡多久，比如 10–15℃、10–15 分钟）；C = 被动休息或常温水浸泡；O = 肌肉酸痛评分（比如视觉模拟评分 VAS，0–10 分）。</p>
        <p>PICO 拆得越清楚，后面三件事就越顺利：检索时知道搜什么词，筛选时知道什么研究该纳入，合并时知道哪些研究"长得像、可以放在一起算"。PICO 含糊，是新手做 Meta 分析翻车的头号原因。</p>
        <div class="tip">💡 练一练：试着把"咖啡因对短跑成绩的影响"拆成 PICO。答案不唯一，但四个部分都必须能说出来。</div>
      `
    },
    {
      h: "四步走完一次 Meta 分析：以及什么时候不该做",
      body: `
        <p>一次完整的 Meta 分析（连同前面的系统评价）大致走四步：<b>检索（search）→ 筛选（screening）→ 纳入（inclusion）→ 合并（pooling）</b>。先系统地把相关研究找全，再按事先定好的标准一轮轮筛掉不合格的，剩下合格的提取数据，最后统计合并。这套流程的报告规范叫 PRISMA，第十章会带你逐条过一遍。</p>
        <p>展开说一句每步在干什么：检索是在多个数据库里用地毯式检索词把可能相关的文献找全，宁可多找不可漏找；筛选是先看标题摘要快速排除明显不相关的，再看全文精筛；纳入是对每篇通过筛选的研究提取数据、评价质量；合并才是本课程后半段的统计主场。记住顺序：前三步是"找证据、挑证据"，最后一步才是"算证据"。</p>
        <p>同样重要的是：<b>什么时候不该做 Meta 分析。</b>两种情况请收手：</p>
        <p>第一，<b>合格的研究太少</b>。比如最后只纳入 2–3 个研究，合并出来的数字极不稳定，一个研究的进出就能翻转结论。这时不如老老实实做系统评价（systematic review）：系统地找、系统地评、用文字总结，不硬算数字。</p>
        <p>第二，<b>研究之间差异大到无法解释</b>。比如有的研究对象是青少年短跑运动员，有的是老年健身者；有的干预每天做，有的每周做一次。把"苹果和橘子"硬平均，得到的数字没有意义。正确做法是先检查这种差异——它叫异质性（heterogeneity），第五章专讲；能分组解释就分组，不能解释就只做系统评价。</p>
        <p>记住这个原则：<b>系统评价是地基，Meta 分析是盖在上面的楼——地基不稳，宁可不盖楼。</b></p>
        <div class="tip">💡 预告：从下一章起，你会反复见到一张图——森林图（forest plot）。一根横线代表一个研究，最后的菱形就是合并结果。学会看它，你就拿到了 Meta 分析的"阅读器"。</div>
      `
    }
  ],
  workbench: null,
  workbenchNote: "",
  quiz: [
    {
      q: "Meta 分析与传统叙述性综述的本质区别是什么？",
      options: [
        "Meta 分析纳入的文献数量更多",
        "Meta 分析用统计方法把各研究结果定量合并，叙述性综述只用文字描述",
        "Meta 分析的图表更好看",
        "Meta 分析的结论一定更可信"
      ],
      answer: 1,
      explain: "本质区别在于合成方式：定量统计合并 vs 定性文字描述。文献多少、图表好不好看都是表面差异；至于可信度，如果纳入的原始研究质量差，Meta 分析也会'垃圾进、垃圾出'，所以 D 错。"
    },
    {
      q: "PICO 中的 C 指的是什么？",
      options: [
        "结论（conclusion）",
        "对照（comparison）",
        "可信区间（confidence interval）",
        "相关系数（correlation）"
      ],
      answer: 1,
      explain: "C = comparison，即'跟什么比'，比如冷水浸泡 vs 被动休息。A 的 conclusion 不是 PICO 的组成部分；C 和 D 是统计术语，和 PICO 无关。"
    },
    {
      q: "以下哪种情况不该做 Meta 分析？",
      options: [
        "纳入了 20 个高质量且问题相似的研究",
        "各研究在对象、干预、结局上差异巨大，且无法用分组解释",
        "所有研究都报告了均值和标准差",
        "研究问题可以用 PICO 清楚拆解"
      ],
      answer: 1,
      explain: "研究间差异大到无法解释时，硬合并就是'把苹果和橘子平均'，数字没有意义，应该只做系统评价。A、C、D 恰恰是适合做 Meta 分析的条件。"
    },
    {
      q: "为什么 Meta 分析合并时要给不同研究不同的权重，而不是'一人一票'？",
      options: [
        "为了让图表看起来更复杂",
        "因为各研究的样本量和估计精确度不同，精确的研究应占更大权重",
        "因为阳性结果的研究更值得信任",
        "权重只是个形式，对结果没影响"
      ],
      answer: 1,
      explain: "小样本研究的估计偶然性大，大样本、精确度高的研究更可靠，所以合并时按精确度加权。'数人头'式的一人一票完全忽略了这种差别，是最粗糙的做法。"
    },
    {
      q: "'垃圾进、垃圾出'（garbage in, garbage out）想说明什么？",
      options: [
        "数据提取时要把垃圾文献扔掉",
        "如果纳入的原始研究质量都很差，合并结果也不可靠",
        "Meta 分析不适合环境科学以外的领域",
        "统计软件会自动剔除质量差的研究"
      ],
      answer: 1,
      explain: "Meta 分析不能无中生有：输入的是低质量研究，输出的就是'精确的错误'。所以检索和质量评价（第九、十章）跟统计合并同等重要。统计软件不会替你判断研究质量，D 错。"
    }
  ]

ML.forestSVG = function (studies, res, title) {
  var W = 760, rowH = 36, top = 56, left = 200, right = 170, plotW = W - left - right;
  var H = top + rowH * (studies.length + 2) + 40;
  var lo = Infinity, hi = -Infinity, i, s;
  studies.forEach(function (st) {
    lo = Math.min(lo, st.y - 1.96 * st.se); hi = Math.max(hi, st.y + 1.96 * st.se);
  });
  lo = Math.min(lo, res.ci[0], res.pred ? res.pred[0] : lo);
  hi = Math.max(hi, res.ci[1], res.pred ? res.pred[1] : hi);
  var pad = (hi - lo) * 0.08 || 0.2; lo -= pad; hi += pad;
  function X(v) { return left + (v - lo) / (hi - lo) * plotW; }
  function Y(r) { return top + r * rowH + rowH / 2; }
  var sw = 0; res.weights.forEach(function (w) { sw += w; });
  var o = [];
  o.push('<svg class="plot" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">');
  o.push('<text x="16" y="26" font-size="16" font-weight="bold" fill="#0b5a55">' + ML.esc(title || '森林图') + '</text>');
  o.push('<text x="' + left + '" y="' + (top - 28) + '" font-size="12" fill="#78716c">研究</text>');
  o.push('<text x="' + (W - right + 8) + '" y="' + (top - 28) + '" font-size="12" fill="#78716c">效应量 [95% CI]</text>');
  o.push('<text x="' + (W - 52) + '" y="' + (top - 28) + '" font-size="12" fill="#78716c">权重</text>');
  if (lo < 0 && hi > 0)
    o.push('<line x1="' + X(0) + '" y1="' + (top - 8) + '" x2="' + X(0) + '" y2="' + (H - 30) + '" stroke="#a8a29e" stroke-dasharray="5,4"/>');
  studies.forEach(function (st, r) {
    var w = res.weights[r], wpct = 100 * w / sw, y = Y(r);
    var sz = 4 + 9 * Math.sqrt(w / sw * studies.length);
    o.push('<text x="16" y="' + (y + 4) + '" font-size="13">' + ML.esc(st.name) + '</text>');
    o.push('<line x1="' + X(st.y - 1.96 * st.se) + '" y1="' + y + '" x2="' + X(st.y + 1.96 * st.se) + '" y2="' + y + '" stroke="#0f766e" stroke-width="2"/>');
    o.push('<rect x="' + (X(st.y) - sz / 2) + '" y="' + (y - sz / 2) + '" width="' + sz + '" height="' + sz + '" fill="#0f766e"/>');
    o.push('<text x="' + (W - right + 8) + '" y="' + (y + 4) + '" font-size="12" fill="#44403c">' +
      ML.fmt(st.y) + ' [' + ML.fmt(st.y - 1.96 * st.se) + ', ' + ML.fmt(st.y + 1.96 * st.se) + ']</text>');
    o.push('<text x="' + (W - 52) + '" y="' + (y + 4) + '" font-size="12" fill="#44403c">' + ML.fmt(wpct, 1) + '%</text>');
  });
  var dr = studies.length + 0.6, dy = Y(dr), cx = X(res.pooled);
  o.push('<text x="16" y="' + (dy + 4) + '" font-size="13" font-weight="bold">合并（随机效应）</text>');
  o.push('<polygon points="' + X(res.ci[0]) + ',' + dy + ' ' + cx + ',' + (dy - 9) + ' ' + X(res.ci[1]) + ',' + dy + ' ' + cx + ',' + (dy + 9) + '" fill="#b45309"/>');
  o.push('<text x="' + (W - right + 8) + '" y="' + (dy + 4) + '" font-size="12" font-weight="bold" fill="#92400e">' +
    ML.fmt(res.pooled) + ' [' + ML.fmt(res.ci[0]) + ', ' + ML.fmt(res.ci[1]) + ']</text>');
  o.push('<text x="16" y="' + (H - 10) + '" font-size="12" fill="#78716c">方块大小代表权重；菱形为合并效应及其 95% CI；虚线为无效线。</text>');
  o.push('</svg>');
  return o.join('');
};

ML.funnelSVG = function (studies, res, title) {
  var W = 600, H = 440, L = 64, R = 24, T = 44, B = 52, pw = W - L - R, ph = H - T - B;
  var lo = Infinity, hi = -Infinity, maxSe = 0, s;
  studies.forEach(function (st) {
    lo = Math.min(lo, st.y); hi = Math.max(hi, st.y); maxSe = Math.max(maxSe, st.se);
  });
  var span = Math.max(hi - lo, 1.96 * maxSe * 2.4, 0.2), mid = (hi + lo) / 2;
  lo = Math.min(lo, res.pooled - span / 2); hi = Math.max(hi, res.pooled + span / 2);
  maxSe *= 1.12;
  function X(v) { return L + (v - lo) / (hi - lo) * pw; }
  function Y(se) { return T + se / maxSe * ph; }
  var o = [];
  o.push('<svg class="plot" viewBox="0 0 ' + W + ' ' + H + '" xmlns="http://www.w3.org/2000/svg">');
  o.push('<text x="16" y="26" font-size="16" font-weight="bold" fill="#0b5a55">' + ML.esc(title || '漏斗图') + '</text>');
  var se, x1 = X(res.pooled - 1.96 * maxSe), x2 = X(res.pooled + 1.96 * maxSe);
  o.push('<line x1="' + X(res.pooled) + '" y1="' + T + '" x2="' + X(res.pooled) + '" y2="' + (T + ph) + '" stroke="#a8a29e" stroke-dasharray="5,4"/>');
  o.push('<line x1="' + X(res.pooled) + '" y1="' + T + '" x2="' + x1 + '" y2="' + (T + ph) + '" stroke="#d6d3d1"/>');
  o.push('<line x1="' + X(res.pooled) + '" y1="' + T + '" x2="' + x2 + '" y2="' + (T + ph) + '" stroke="#d6d3d1"/>');
  studies.forEach(function (st) {
    o.push('<circle cx="' + X(st.y).toFixed(1) + '" cy="' + Y(st.se).toFixed(1) + '" r="5" fill="#0f766e" opacity="0.75"/>');
  });
  o.push('<text x="' + (L + pw / 2) + '" y="' + (H - 12) + '" font-size="13" text-anchor="middle" fill="#57534e">效应量</text>');
  o.push('<text x="16" y="' + (T + ph / 2) + '" font-size="13" text-anchor="middle" fill="#57534e" transform="rotate(-90 16 ' + (T + ph / 2) + ')">标准误</text>');
  o.push('<text x="16" y="' + (H - 12) + '" font-size="12" fill="#78716c">越靠上精度越高；对称漏斗提示偏倚风险较低。</text>');
  o.push('</svg>');
  return o.join('');
};

ML.progress = (function () {
  var k = 'ml-learn-v1', d = { read: {}, quiz: {} };
  try { var s = localStorage.getItem(k); if (s) d = JSON.parse(s); } catch (e) {}
  return {
    data: d,
    save: function () { try { localStorage.setItem(k, JSON.stringify(d)); } catch (e) {} },
    markRead: function (id) { d.read[id] = true; this.save(); },
    setQuiz: function (id, score) { if (!d.quiz[id] || score > d.quiz[id]) d.quiz[id] = score; this.save(); }
  };
})();

ML.download = function (name, text, mime) {
  var blob = new Blob(["\ufeff" + text], { type: mime || 'text/plain;charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 800);
};

    h += '<div class="quiz" data-qi="' + qi + '"><div class="qq">' + (qi + 1) + '. ' + ML.esc(q.q) + '</div>';
    q.options.forEach(function (op, oi) {
      h += '<button class="opt" data-oi="' + oi + '">' + ML.esc(op) + '</button>';
    });
    h += '<div class="exp">' + ML.esc(q.explain) + '</div></div>';
  });
  h += '</div><p>得分：<span class="score" id="qscore">—</span></p>';
  var prev = idx > 0 ? ML.chapters[idx - 1] : null, next = idx < ML.chapters.length - 1 ? ML.chapters[idx + 1] : null;
  h += '<div class="btnrow"><button class="btn ghost" id="markread">' +
    (ML.progress.data.read[c.id] ? '✓ 已学完' : '标记为已学完') + '</button></div>';
  h += '<div class="pager">' +
    (prev ? '<a class="btn ghost" href="#/chapter/' + prev.id + '">← ' + prev.num + '</a>' : '<span></span>') +
    (next ? '<a class="btn" href="#/chapter/' + next.id + '">' + next.num + ' →</a>' : '<a class="btn" href="#/labs">去复现实战 →</a>') + '</div>';
  ML.shell('chapters', h);
  document.getElementById('markread').onclick = function () {
    ML.progress.markRead(c.id); this.textContent = '✓ 已学完';
  };
  /* 小测交互 */
  var answered = 0, correct = 0, total = c.quiz.length;
  ML.$$('.quiz').forEach(function (box) {
    var qi = +box.getAttribute('data-qi'), q = c.quiz[qi], doneQ = false;
    ML.$$('.opt', box).forEach(function (btn) {
      btn.onclick = function () {
        if (doneQ) return; doneQ = true;
        var oi = +btn.getAttribute('data-oi');
        ML.$$('.opt', box).forEach(function (b2, bi) {
          b2.disabled = true;
          if (bi === q.answer) b2.classList.add('correct');
        });
        if (oi === q.answer) correct++; else btn.classList.add('wrong');
        box.querySelector('.exp').classList.add('show');
        answered++;
        if (answered === total) {
          var score = Math.round(100 * correct / total);
          document.getElementById('qscore').textContent = correct + ' / ' + total + '（' + score + ' 分）';
          ML.progress.setQuiz(c.id, score);
        } else {
          document.getElementById('qscore').textContent = '已答 ' + answered + ' / ' + total;
        }
      };
    });
  });
};

ML.num = function (id) { var v = parseFloat(document.getElementById(id).value); return isNaN(v) ? NaN : v; };

ML.wbSmd = function () {
  var el = document.getElementById('wbbody');
  el.innerHTML = '<div class="card"><h3 style="margin-top:0">效应量计算器</h3>' +
    '<div class="fgrid"><label>数据类型<select id="smdtype"><option value="cont">连续变量（两组均值±标准差）</option><option value="bin">二分类（2×2 表）</option><option value="r">相关系数 r</option></select></label></div>' +
    '<div id="smdform"></div><div class="btnrow"><button class="btn" id="smdgo">计算</button></div><div id="smdout"></div></div>';
  var S = ML.stats;
  function form() {
    var t = document.getElementById('smdtype').value, h = '';
    if (t === 'cont')
      h = '<div class="fgrid"><label>效应量种类<select id="smdkind"><option value="g">SMD（Hedges g，推荐）</option><option value="md">MD（均值差）</option></select></label></div>' +
        '<div class="fgrid"><label>干预组 n1<input id="n1" type="number" value="20"></label><label>干预组均值 M1<input id="m1" type="number" value="12.5"></label><label>干预组 SD1<input id="sd1" type="number" value="3.0"></label>' +
        '<label>对照组 n2<input id="n2" type="number" value="20"></label><label>对照组均值 M2<input id="m2" type="number" value="9.8"></label><label>对照组 SD2<input id="sd2" type="number" value="2.8"></label></div>' +
        '<p class="note">示例数据来自第二章手算例，点"计算"应得 g ≈ 0.91。</p>';
    else if (t === 'bin')
      h = '<div class="fgrid"><label>效应量种类<select id="smdkind"><option value="or">OR（比值比）</option><option value="rr">RR（相对危险度）</option></select></label></div>' +
        '<div class="fgrid"><label>干预组发生数 a<input id="a" type="number" value="12"></label><label>干预组未发生数 b<input id="b" type="number" value="88"></label>' +
        '<label>对照组发生数 c<input id="c" type="number" value="20"></label><label>对照组未发生数 d<input id="d" type="number" value="80"></label></div>' +
        '<p class="note">合并分析时请用对数尺度（lnOR / lnRR）及其标准误；本工具同时给出换回原尺度的 OR/RR 及其 CI。</p>';
    else
      h = '<div class="fgrid"><label>相关系数 r（-1～1）<input id="r" type="number" value="0.42" step="0.01"></label><label>样本量 n<input id="n" type="number" value="60"></label></div>' +
        '<p class="note">相关系数的合并在 Fisher z 尺度上进行，之后再换回 r。</p>';
    document.getElementById('smdform').innerHTML = h;
    document.getElementById('smdout').innerHTML = '';
  }
  document.getElementById('smdtype').onchange = form; form();
  document.getElementById('smdgo').onclick = function () {
    var t = document.getElementById('smdtype').value, out = '', r;
    function ci(y, se) { return [y - 1.96 * se, y + 1.96 * se]; }
    if (t === 'cont') {
      var n1 = ML.num('n1'), m1 = ML.num('m1'), sd1 = ML.num('sd1'), n2 = ML.num('n2'), m2 = ML.num('m2'), sd2 = ML.num('sd2');
      if ([n1, m1, sd1, n2, m2, sd2].some(isNaN) || n1 < 2 || n2 < 2 || sd1 <= 0 || sd2 <= 0) { alert('请检查输入：样本量≥2，标准差>0'); return; }
      if (document.getElementById('smdkind').value === 'g') {
        r = S.hedgesG(n1, m1, sd1, n2, m2, sd2); var c = ci(r.g, r.se);
        out = '<table class="tbl res"><tr><th>指标</th><th>值</th></tr>' +
          '<tr><td>Cohen\'s d</td><td class="num">' + ML.fmt(r.d, 3) + '</td></tr>' +
          '<tr><td>小样本校正系数 J</td><td class="num">' + ML.fmt(r.J, 4) + '</td></tr>' +
          '<tr><td><b>Hedges\'s g</b></td><td class="num"><b>' + ML.fmt(r.g, 3) + '</b></td></tr>' +
          '<tr><td>标准误 SE</td><td class="num">' + ML.fmt(r.se, 3) + '</td></tr>' +
          '<tr><td>95% CI</td><td class="num">[' + ML.fmt(c[0], 3) + ', ' + ML.fmt(c[1], 3) + ']</td></tr></table>';
      } else {
        r = S.meanDiff(n1, m1, sd1, n2, m2, sd2); var c2 = ci(r.md, r.se);
        out = '<table class="tbl res"><tr><th>指标</th><th>值</th></tr>' +
          '<tr><td><b>均值差 MD</b></td><td class="num"><b>' + ML.fmt(r.md, 3) + '</b></td></tr>' +
          '<tr><td>标准误 SE</td><td class="num">' + ML.fmt(r.se, 3) + '</td></tr>' +
          '<tr><td>95% CI</td><td class="num">[' + ML.fmt(c2[0], 3) + ', ' + ML.fmt(c2[1], 3) + ']</td></tr></table>';
      }
    } else if (t === 'bin') {
      var a = ML.num('a'), b = ML.num('b'), cc = ML.num('c'), d = ML.num('d');
      if ([a, b, cc, d].some(isNaN) || Math.min(a, b, cc, d) <= 0) { alert('2×2 表四个格子都必须 > 0'); return; }
      var kind = document.getElementById('smdkind').value;
      r = kind === 'or' ? S.or2x2(a, b, cc, d) : S.rr2x2(a, b, cc, d);
      var y = r.logor, c3 = ci(y, r.se);
      out = '<table class="tbl res"><tr><th>指标</th><th>值</th></tr>' +
        '<tr><td>ln(' + kind.toUpperCase() + ')</td><td class="num">' + ML.fmt(y, 3) + '</td></tr>' +
        '<tr><td>标准误 SE（对数尺度）</td><td class="num">' + ML.fmt(r.se, 3) + '</td></tr>' +
        '<tr><td><b>' + kind.toUpperCase() + '</b></td><td class="num"><b>' + ML.fmt(Math.exp(y), 3) + '</b></td></tr>' +
        '<tr><td>95% CI（原尺度）</td><td class="num">[' + ML.fmt(Math.exp(c3[0]), 3) + ', ' + ML.fmt(Math.exp(c3[1]), 3) + ']</td></tr></table>';
    } else {
      var rv = ML.num('r'), n = ML.num('n');
      if (isNaN(rv) || isNaN(n) || Math.abs(rv) >= 1 || n < 4) { alert('要求 |r|<1 且 n≥4'); return; }
      r = S.rToZ(rv, n); var c4 = ci(r.z, r.se);
      out = '<table class="tbl res"><tr><th>指标</th><th>值</th></tr>' +
        '<tr><td>Fisher\'s z</td><td class="num">' + ML.fmt(r.z, 3) + '</td></tr>' +
        '<tr><td>标准误 SE</td><td class="num">' + ML.fmt(r.se, 3) + '</td></tr>' +
        '<tr><td>95% CI（z 尺度）</td><td class="num">[' + ML.fmt(c4[0], 3) + ', ' + ML.fmt(c4[1], 3) + ']</td></tr>' +
        '<tr><td><b>95% CI（换回 r）</b></td><td class="num"><b>[' + ML.fmt(Math.tanh(c4[0]), 3) + ', ' + ML.fmt(Math.tanh(c4[1]), 3) + ']</b></td></tr></table>';
    }
    document.getElementById('smdout').innerHTML = '<h3>计算结果</h3>' + out;
  };
};

ML.wbConvert = function () {
  var el = document.getElementById('wbbody'), S = ML.stats;
  el.innerHTML = '<div class="card"><h3 style="margin-top:0">数据转换器：SE / 95%CI / p 值 → 标准差</h3>' +
    '<p class="note">论文里经常只报告标准误、置信区间或 p 值。先把它们换算成标准差，才能计算效应量。<b>以下均为单组均值（或已算好的均值差）的通用换算</b>，两组比较的精确换算见第三章。</p>' +
    '<div class="fgrid"><label>已知什么<select id="cvtype"><option value="se">标准误 SE → SD</option><option value="ci">95% CI → SD</option><option value="p">p 值 → SD</option></select></label></div>' +
    '<div id="cvform"></div><div class="btnrow"><button class="btn" id="cvgo">换算</button></div><div id="cvout"></div></div>';
  function form() {
    var t = document.getElementById('cvtype').value, h = '';
    if (t === 'se') h = '<div class="fgrid"><label>标准误 SE<input id="v_se" type="number" value="1.2"></label><label>样本量 n<input id="v_n" type="number" value="25"></label></div><p class="note">公式：SD = SE × √n</p>';
    else if (t === 'ci') h = '<div class="fgrid"><label>CI 下限<input id="v_lo" type="number" value="2.0"></label><label>CI 上限<input id="v_hi" type="number" value="8.0"></label><label>样本量 n<input id="v_n" type="number" value="36"></label></div><p class="note">公式：SD = √n × (上限−下限) / (2 × t<sub>0.975, n−1</sub>)。第三章手算用 1.96 近似得 9.18；本工具查精确 t 值（n=36 时 t=2.03），得约 8.87——差异只来自近似精度，方法完全一致。</p>';
    else h = '<div class="fgrid"><label>均值差（绝对值）<input id="v_md" type="number" value="4.2"></label><label>双侧 p 值<input id="v_p" type="number" value="0.05" step="0.001"></label><label>样本量 n<input id="v_n" type="number" value="30"></label></div><p class="note">思路：p → t 值 → SE = |均值差| / t → SD = SE × √n。手算例取 t≈2.10 得 10.95；工具用精确 t 值，结果略有差异，属正常。</p>';
    document.getElementById('cvform').innerHTML = h;
    document.getElementById('cvout').innerHTML = '';
  }
  document.getElementById('cvtype').onchange = form; form();
  document.getElementById('cvgo').onclick = function () {
    var t = document.getElementById('cvtype').value, out = '';
    if (t === 'se') {
      var se = ML.num('v_se'), n = ML.num('v_n');
      if (isNaN(se) || isNaN(n) || n < 1 || se < 0) { alert('请检查输入'); return; }
      var sd = S.sdFromSE(se, n);
      out = '<p>SD = ' + se + ' × √' + n + ' = <b>' + ML.fmt(sd, 2) + '</b></p>';
    } else if (t === 'ci') {
      var lo = ML.num('v_lo'), hi = ML.num('v_hi'), n2 = ML.num('v_n');
      if (isNaN(lo) || isNaN(hi) || isNaN(n2) || n2 < 2 || hi <= lo) { alert('请检查输入：n≥2，且上限>下限'); return; }
      var tt = S.tQ(0.975, n2 - 1), sd2 = S.sdFromCI(lo, hi, n2);
      out = '<p>t<sub>0.975, ' + (n2 - 1) + '</sub> = ' + ML.fmt(tt, 3) + '<br>SD = √' + n2 + ' × (' + hi + '−' + lo + ') / (2×' + ML.fmt(tt, 3) + ') = <b>' + ML.fmt(sd2, 2) + '</b></p>';
    } else {
      var mdd = ML.num('v_md'), p = ML.num('v_p'), n3 = ML.num('v_n');
      if (isNaN(mdd) || isNaN(p) || isNaN(n3) || n3 < 2 || p <= 0 || p >= 1) { alert('请检查输入：n≥2，0<p<1'); return; }
      var t2 = S.tQ(1 - p / 2, n3 - 1), se2 = Math.abs(mdd) / t2, sd3 = S.sdFromP(mdd, p, n3);
      out = '<p>t = ' + ML.fmt(t2, 3) + '；SE = ' + mdd + ' / ' + ML.fmt(t2, 3) + ' = ' + ML.fmt(se2, 3) + '<br>SD = ' + ML.fmt(se2, 3) + ' × √' + n3 + ' = <b>' + ML.fmt(sd3, 2) + '</b></p>';
    }
    document.getElementById('cvout').innerHTML = '<h3>换算结果</h3>' + out;
  };
};

ML.parseMetaInput = function (text, format) {
  var lines = text.split('\n'), studies = [], errs = [], S = ML.stats;
  lines.forEach(function (ln, li) {
    ln = ln.trim(); if (!ln || ln[0] === '#') return;
    var p;
    if (/[,，]/.test(ln)) p = ln.split(/[,，]/).map(function (x) { return x.trim(); }).filter(function (x) { return x !== ''; });
    else p = ln.split(/[\t;；\s]+/).filter(function (x) { return x !== ''; });
    try {
      if (format === 'raw') {
        if (p.length < 7) throw '列数不足';
        var n1 = +p[1], m1 = +p[2], sd1 = +p[3], n2 = +p[4], m2 = +p[5], sd2 = +p[6];
        if ([n1, m1, sd1, n2, m2, sd2].some(isNaN) || n1 < 2 || n2 < 2 || sd1 <= 0 || sd2 <= 0) throw '数值非法';
        var r = S.hedgesG(n1, m1, sd1, n2, m2, sd2);
        studies.push({ name: p[0], y: r.g, se: r.se });
      } else {
        if (p.length < 3) throw '列数不足';
        var y = +p[1], se = +p[2];
        if (isNaN(y) || isNaN(se) || se <= 0) throw '数值非法';
        studies.push({ name: p[0], y: y, se: se });
      }
    } catch (e) { errs.push('第 ' + (li + 1) + ' 行：' + e); }
  });
  return { studies: studies, errs: errs };
};

ML.wbMeta = function () {
  var el = document.getElementById('wbbody'), S = ML.stats;
  var sample = '# 每行：研究名, 效应量, 标准误\n研究A, 0.80, 0.30\n研究B, 0.40, 0.20\n研究C, 0.60, 0.40';
  var sampleRaw = '# 每行：研究名, n1, M1, SD1, n2, M2, SD2（自动算 Hedges g）\n研究A, 20, 12.5, 3.0, 20, 9.8, 2.8\n研究B, 30, 15.1, 4.2, 30, 13.9, 4.0\n研究C, 15, 11.0, 2.5, 15, 10.2, 2.6';
  el.innerHTML = '<div class="card"><h3 style="margin-top:0">合并分析工作台</h3>' +
    '<div class="fgrid"><label>输入格式<select id="mfmt"><option value="yv">效应量 + 标准误（每行：研究名, y, se）</option><option value="raw">原始均值数据（每行：研究名, n1,M1,SD1, n2,M2,SD2）</option></select></label></div>' +
    '<textarea id="mdata" rows="7" placeholder="每行一个研究"></textarea>' +
    '<div class="btnrow"><button class="btn" id="mgo">开始合并</button><button class="btn ghost" id="msample">载入示例</button><button class="btn ghost" id="mclear">清空</button></div>' +
    '<div id="mout"></div><p class="note">做 OR/RR 的合并请先取对数（lnOR/lnRR）再粘贴；相关系数请先做 Fisher z 转换。示例数据来自第四章手算例。</p></div>';
  var ta = document.getElementById('mdata'); ta.value = sample;
  document.getElementById('mfmt').onchange = function () { ta.value = this.value === 'raw' ? sampleRaw : sample; };
  document.getElementById('msample').onclick = function () {
    ta.value = document.getElementById('mfmt').value === 'raw' ? sampleRaw : sample;
  };
  document.getElementById('mclear').onclick = function () { ta.value = ''; document.getElementById('mout').innerHTML = ''; };
  document.getElementById('mgo').onclick = function () {
    var fmt = document.getElementById('mfmt').value;
    var pr = ML.parseMetaInput(ta.value, fmt);
    if (pr.errs.length) { alert('输入有误：\n' + pr.errs.slice(0, 5).join('\n')); return; }
    if (pr.studies.length < 2) { alert('至少需要 2 个研究'); return; }
    var ys = pr.studies.map(function (s) { return s.y; });
    var vs = pr.studies.map(function (s) { return s.se * s.se; });
    var ses = pr.studies.map(function (s) { return s.se; });
    var fx = S.metaFixed(ys, vs), rn = S.metaRandom(ys, vs);
    var h = '<h3>合并结果（k = ' + ys.length + '）</h3>';
    h += '<table class="tbl res"><tr><th>模型</th><th>合并效应</th><th>95% CI</th><th>SE</th></tr>' +
      '<tr><td>固定效应（逆方差）</td><td class="num">' + ML.fmt(fx.pooled, 3) + '</td><td class="num">[' + ML.fmt(fx.ci[0], 3) + ', ' + ML.fmt(fx.ci[1], 3) + ']</td><td class="num">' + ML.fmt(fx.se, 3) + '</td></tr>' +
      '<tr><td><b>随机效应（DL）</b></td><td class="num"><b>' + ML.fmt(rn.pooled, 3) + '</b></td><td class="num"><b>[' + ML.fmt(rn.ci[0], 3) + ', ' + ML.fmt(rn.ci[1], 3) + ']</b></td><td class="num">' + ML.fmt(rn.se, 3) + '</td></tr></table>';
    h += '<table class="tbl res"><tr><th>异质性指标</th><th>值</th><th>解读</th></tr>' +
      '<tr><td>Q（df=' + fx.df + '）</td><td class="num">' + ML.fmt(fx.Q, 2) + '</td><td>p = ' + ML.fmt(fx.pQ, 3) + (fx.pQ < 0.10 ? '（<0.10，提示有异质性）' : '（≥0.10）') + '</td></tr>' +
      '<tr><td>I²</td><td class="num">' + ML.fmt(100 * rn.I2, 1) + '%</td><td>' + (rn.I2 < 0.25 ? '较低' : rn.I2 < 0.5 ? '中等' : rn.I2 < 0.75 ? '较高' : '很高') + '（经验参考，非金标准）</td></tr>' +
      '<tr><td>τ²</td><td class="num">' + ML.fmt(rn.tau2, 4) + '</td><td>研究间方差</td></tr>' +
      '<tr><td>95% 预测区间</td><td class="num">[' + ML.fmt(rn.pred[0], 3) + ', ' + ML.fmt(rn.pred[1], 3) + ']</td><td>未来类似研究的可能范围</td></tr></table>';
    h += ML.forestSVG(pr.studies, rn, '森林图（随机效应）');
    if (ys.length >= 3) {
      var eg = S.egger(ys, ses);
      h += '<h3>发表偏倚初筛</h3>' + ML.funnelSVG(pr.studies, rn, '漏斗图') +
        '<table class="tbl res"><tr><th>Egger 检验</th><th>值</th></tr>' +
        '<tr><td>截距</td><td class="num">' + ML.fmt(eg.b0, 3) + '</td></tr>' +
        '<tr><td>t（df=' + eg.df + '）</td><td class="num">' + ML.fmt(eg.t, 3) + '</td></tr>' +
        '<tr><td>p 值</td><td class="num">' + ML.fmt(eg.p, 3) + (eg.p < 0.10 ? '（<0.10，提示不对称）' : '') + '</td></tr></table>' +
        '<p class="note">研究少时 Egger 检验功效很低；漏斗图不对称也可能来自异质性。详见第八章。</p>';
      var loo = S.leaveOneOut(ys, vs);
      h += '<h3>留一法敏感性分析</h3><table class="tbl res"><tr><th>剔除的研究</th><th>合并效应</th><th>95% CI</th><th>I²</th></tr>';
      loo.forEach(function (L) {
        h += '<tr><td>' + ML.esc(pr.studies[L.dropped].name) + '</td><td class="num">' + ML.fmt(L.pooled, 3) + '</td><td class="num">[' + ML.fmt(L.ci[0], 3) + ', ' + ML.fmt(L.ci[1], 3) + ']</td><td class="num">' + ML.fmt(100 * L.I2, 1) + '%</td></tr>';
      });
      h += '</table>';
    } else h += '<p class="note">研究数 ≥3 时才会显示 Egger 检验与留一法。</p>';
    document.getElementById('mout').innerHTML = h;
  };
};

/* ---------------- 复现实战 ---------------- */
ML.labsView = function () {
  var h = '<h2 class="sec" style="margin-top:6px">复现实战实验室</h2><p>两篇真实的体育科学 Meta 分析。每个实战都提供：论文信息 → PICO → 数据提取表 → 分步计算（每步可核对）→ 与原文结果对照。</p>';
  ML.labs.forEach(function (L) {
    h += '<div class="card"><h3 style="margin-top:0">🔬 ' + ML.esc(L.title) + '</h3>' +
      '<p class="note">' + ML.esc(L.paper) + '</p><p>' + ML.esc(L.blurb) + '</p>' +
      '<a class="btn" href="#/lab/' + L.id + '">进入实战</a></div>';
  });
  h += '<div class="card"><h3 style="margin-top:0">实战方法</h3><ol><li>先读论文的"方法"部分，确认效应量类型和合并模型。</li><li>对照提取表，把每个研究的数据亲手算一遍效应量（用工作台验证）。</li><li>跑合并：先固定、再随机，对照每一步的核对点。</li><li>最后看"与原文对照"：数字对上了，你就真正复现了一篇论文。</li></ol></div>';
  ML.shell('labs', h);
};

ML.labView = function (id) {
  var L = null, i;
  for (i = 0; i < ML.labs.length; i++) if (ML.labs[i].id === id) L = ML.labs[i];
  if (!L || !L.studies || !L.studies.length) { ML.shell('labs', '<div class="card"><p>实战数据正在验算中，稍后上线。</p><a class="btn ghost" href="#/labs">返回</a></div>'); return; }
  var S = ML.stats, h = '';
  var studies = L.studies.map(function (st) {
    if (st.y !== undefined) return { name: st.name, y: st.y, se: (st.hi - st.lo) / 3.92, src: st.src };
    var r;
    if (L.effect === 'MD') {
      var v = st.sd1 * st.sd1 / st.n1 + st.sd2 * st.sd2 / st.n2;
      r = { md: st.m1 - st.m2, se: Math.sqrt(v) };
      return { name: st.name, y: r.md, se: r.se, src: st.src };
    }
    r = S.hedgesG(st.n1, st.m1, st.sd1, st.n2, st.m2, st.sd2);
    return { name: st.name, y: r.g, se: r.se, src: st.src };
  });
  var ys = studies.map(function (s) { return s.y; }), vs = studies.map(function (s) { return s.se * s.se; });
  var rn = S.metaRandom(ys, vs);
  var effName = L.effect === 'MD' ? 'MD（均值差）' : "SMD（Hedges's g）";
  h += '<p class="note"><a href="#/labs">← 复现实战</a></p><h2 class="sec" style="margin-top:0">' + ML.esc(L.title) + '</h2>';
  h += '<div class="card"><p class="note">' + ML.esc(L.paper) + '</p>' + L.background +
    (L.dirNote ? '<div class="tip">🧭 ' + L.dirNote + '</div>' : '') + '</div>';
  h += '<div class="card"><h3 style="margin-top:0">📋 数据提取表</h3><div style="overflow-x:auto">';
  var rawForm = L.studies.length && L.studies[0].n1 !== undefined;
  if (rawForm) {
    h += '<table class="tbl res"><tr><th>研究</th><th>n1</th><th>M1</th><th>SD1</th><th>n2</th><th>M2</th><th>SD2</th><th>' + (L.effect === 'MD' ? 'MD' : 'SMD(g)') + '</th><th>来源</th></tr>';
    L.studies.forEach(function (st, ix) {
      h += '<tr><td>' + ML.esc(st.name) + '</td><td class="num">' + st.n1 + '</td><td class="num">' + st.m1 + '</td><td class="num">' + st.sd1 + '</td><td class="num">' + st.n2 + '</td><td class="num">' + st.m2 + '</td><td class="num">' + st.sd2 + '</td><td class="num"><b>' + ML.fmt(studies[ix].y, 2) + '</b></td><td class="note">' + ML.esc(studies[ix].src || '') + '</td></tr>';
    });
    h += '</table></div><p class="note">n1/M1/SD1 = 对照组，安慰剂组；n2/M2/SD2 = 干预组。' + effName + '列是按原始数据算出的，你可以在工作台里逐个验证。</p></div>';
  } else {
    h += '<table class="tbl res"><tr><th>研究</th><th>MD</th><th>95% CI</th><th>数据来源</th></tr>';
    L.studies.forEach(function (st, ix) {
      h += '<tr><td>' + ML.esc(st.name) + '</td><td class="num"><b>' + ML.fmt(studies[ix].y, 2) + '</b></td><td class="num">[' + ML.fmt(st.lo, 1) + ', ' + ML.fmt(st.hi, 1) + ']</td><td class="note">' + ML.esc(studies[ix].src || '') + '</td></tr>';
    });
    h += '</table></div><p class="note">研究水平效应量来自原文森林图读数（精度约 0.1），已标注；合并结果已与原文发表值核对一致。</p></div>';
  }
  h += '<h2 class="sec">分步复现</h2>';
  L.steps.forEach(function (st, ix) {
    h += '<div class="step"><h4>步骤 ' + (ix + 1) + '：' + ML.esc(st.h) + '</h4>' + st.body +
      (st.check ? '<div class="check"><b>✓ 核对点：</b>' + st.check + '</div>' : '') + '</div>';
  });
  h += '<h2 class="sec">你的森林图</h2>' + ML.forestSVG(studies, rn, '复现森林图（随机效应）');
  h += '<div class="card"><h3 style="margin-top:0">🎯 与原文对照</h3><table class="tbl res"><tr><th>指标</th><th>你的复现</th><th>原文报告</th><th>是否一致</th></tr>';
  L.finalRows.forEach(function (r2) {
    h += '<tr><td>' + ML.esc(r2[0]) + '</td><td class="num">' + r2[1] + '</td><td class="num">' + ML.esc(r2[2]) + '</td><td>' + r2[3] + '</td></tr>';
  });
  h += '</table><p>' + L.conclusion + '</p></div>';
  h += '<div class="pager"><a class="btn ghost" href="#/labs">← 返回实战列表</a><span></span></div>';
  ML.shell('labs', h);
};

/* ---------------- 术语表 ---------------- */
ML.glossaryView = function () {
  var h = '<h2 class="sec" style="margin-top:6px">中英术语表</h2><div class="card"><input type="text" id="gq" placeholder="搜索术语，如：异质性 / I² / forest…"></div><div class="card" id="glist" style="padding:6px 18px"></div>';
  ML.shell('glossary', h);
  function render(q) {
    q = (q || '').toLowerCase();
    var out = '', n = 0;
    ML.glossary.forEach(function (g) {
      if (q && (g.t + ' ' + g.en + ' ' + g.d).toLowerCase().indexOf(q) < 0) return;
      n++;
      out += '<div class="gterm"><b>' + ML.esc(g.t) + '</b><span class="en">' + ML.esc(g.en) + '</span><br><span>' + ML.esc(g.d) + '</span></div>';
    });
    document.getElementById('glist').innerHTML = out || '<p class="note">没有匹配的术语。</p>';
  }
  document.getElementById('gq').oninput = function () { render(this.value); };
  render('');
};

/* ---------------- 模板下载 ---------------- */
ML.prismaSVG = function () {
  function box(x, y, w, t1, t2) {
    return '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="64" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="2"/>' +
      '<text x="' + (x + w / 2) + '" y="' + (y + 26) + '" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b5a55">' + t1 + '</text>' +
      '<text x="' + (x + w / 2) + '" y="' + (y + 48) + '" text-anchor="middle" font-size="13" fill="#57534e">' + t2 + '</text>';
  }
  function arrow(x1, y1, x2, y2) {
    return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" stroke="#78716c" stroke-width="2"/>' +
      '<polygon points="' + x2 + ',' + y2 + ' ' + (x2 - 7) + ',' + (y2 - 10) + ' ' + (x2 + 7) + ',' + (y2 - 10) + '" fill="#78716c"/>';
  }
  var W = 640, s = [];
  s.push('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' 560" width="640">');
  s.push('<text x="20" y="30" font-size="18" font-weight="bold" fill="#1c1917">PRISMA 文献筛选流程图（模板）</text>');
  var cx = W / 2, w = 420, x = cx - w / 2, y = 50, gap = 84;
  var steps = [
    ['数据库检索', 'n = ____'], ['去重后', 'n = ____'],
    ['标题摘要筛选', 'n = ____'], ['全文评估', 'n = ____'], ['纳入 Meta 分析', 'n = ____']
  ];
  steps.forEach(function (st, i) {
    s.push(box(x, y + i * gap, w, st[0], st[1]));
    if (i < steps.length - 1) s.push(arrow(cx, y + i * gap + 64, cx, y + (i + 1) * gap));
  });
  s.push('<text x="20" y="548" font-size="12" fill="#78716c">把 ____ 换成你的实际数字；每一步排除原因建议在旁边注明。</text>');
  s.push('</svg>');
  return s.join('');
};
ML.extractionCSV = function () {
  var rows = [
    ['作者(年)', '国家', '研究设计', '研究对象特征', '样本量_干预组', '样本量_对照组', '干预描述', '对照描述', '结局指标', '干预组均值', '干预组SD', '对照组均值', '对照组SD', '备注'],
    ['例：Smith (2020)', '英国', 'RCT', '男性业余跑者，20-30岁', '20', '20', '冷水浸泡 15°C×15min', '被动休息', '24h后肌肉酸痛VAS', '3.2', '1.1', '4.5', '1.3', '']
  ];
  return rows.map(function (r) { return r.map(function (c) { return '"' + c + '"'; }).join(','); }).join('\n');
};
ML.templatesView = function () {
  var h = '<h2 class="sec" style="margin-top:6px">模板下载</h2>';
  h += '<div class="card"><h3 style="margin-top:0">PRISMA 文献筛选流程图</h3>' + ML.prismaSVG() +
    '<div class="btnrow"><button class="btn" id="dlprisma">下载 SVG</button></div>' +
    '<p class="note">SVG 为矢量图，可用浏览器直接打开打印，或导入 Illustrator / Inkscape 修改数字后放入论文。</p></div>';
  h += '<div class="card"><h3 style="margin-top:0">数据提取表（CSV）</h3><p>用 Excel / WPS 打开即可填写。列：作者(年)、国家、设计、对象特征、两组样本量、干预/对照描述、结局指标、两组均值±SD、备注。</p>' +
    '<div class="btnrow"><button class="btn" id="dlcsv">下载 CSV</button></div></div>';
  ML.shell('templates', h);
  document.getElementById('dlprisma').onclick = function () { ML.download('PRISMA流程图模板.svg', ML.prismaSVG(), 'image/svg+xml'); };
  document.getElementById('dlcsv').onclick = function () { ML.download('数据提取表模板.csv', ML.extractionCSV(), 'text/csv;charset=utf-8'); };
};

/* ---------------- 路由 ---------------- */
ML.route = function () {
  var hsh = location.hash || '#/';
  var p = hsh.replace(/^#\/?/, '').split('/');
  if (p[0] === '' ) ML.homeView();
  else if (p[0] === 'chapters') ML.chaptersView();
  else if (p[0] === 'chapter') ML.chapterView(p[1]);
  else if (p[0] === 'workbench') ML.workbenchView(p[1]);
  else if (p[0] === 'labs') ML.labsView();
  else if (p[0] === 'lab') ML.labView(p[1]);
  else if (p[0] === 'glossary') ML.glossaryView();
  else if (p[0] === 'templates') ML.templatesView();
  else ML.homeView();
};
window.addEventListener('hashchange', ML.route);
ML.route();
