name: Deploy v73 to index.html

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Promote v73 snapshot to index.html
        run: |
          set -euo pipefail
          test -f sport-env-lit-db-v73.html
          if [ -f index.html ]; then
            mv index.html "index-old-$(date +%Y%m%d).html"
          fi
          cp sport-env-lit-db-v73.html index.html
      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "lier09"
          git config user.email "lier09@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Deploy v73 to index.html (memo feature, IndexedDB local)"
            git push
          fi
