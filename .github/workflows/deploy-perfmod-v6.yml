name: Deploy perfmod v6
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp perfmod-db-v6.html perfmod/index.html
      - run: |
          git config user.name "lier09"
          git config user.email "lier09@users.noreply.github.com"
          git add perfmod/index.html
          git commit -m "perfmod-db v6 deploy: index.html refresh" || echo "nothing to commit"
          git push
